server:
  port: ${PORT:8082}

spring:
  application:
    name: leilao-service
  # =====================================================================
  # CAMADA QUERY (READ MODEL): Azure SQL Server (1 banco unificado de leitura)
  # Caso AZURE_SQL_URL não esteja definido, utiliza H2 em modo MSSQLServer para execução local/testes.
  # =====================================================================
  datasource:
    url: ${AZURE_SQL_URL:jdbc:h2:mem:autoleilao_read_db;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${AZURE_SQL_USERNAME:sa}
    password: ${AZURE_SQL_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# =====================================================================
# CAMADA COMMAND (WRITE MODEL - Database per Service): Azure Cosmos DB (MongoDB API)
# =====================================================================
azure:
  cosmos:
    uri: ${AZURE_COSMOS_URI:}
    database: ${AZURE_COSMOS_LEILAO_DB:leilao_command_db}
  # =====================================================================
  # MENSAGERIA ASSÍNCRONA: Azure Service Bus
  # =====================================================================
  servicebus:
    connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING:}
    leilao-cqrs-queue: ${AZURE_SERVICEBUS_LEILAO_CQRS_QUEUE:leilao-cqrs-queue}
    veiculos-leilao-queue: ${AZURE_SERVICEBUS_VEICULOS_LEILAO_QUEUE:veiculos-leilao-queue}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

